{# Фильтры каталога. Ждёт form — BookFilterForm; номер страницы при смене фильтров сбрасывается. #}
<form method="get" class="row g-2 align-items-end mb-4 book-filters" role="search">
    <div class="col-12 col-md-4">
        <label for="{{ form.q.id_for_label }}" class="form-label small text-muted mb-1">{{ form.q.label }}</label>
        {{ form.q }}
    </div>
    <div class="col-6 col-md-3">
        <label for="{{ form.genre.id_for_label }}" class="form-label small text-muted mb-1">{{ form.genre.label }}</label>
        {{ form.genre }}
    </div>
    <div class="col-6 col-md-3">
        <label for="{{ form.author.id_for_label }}" class="form-label small text-muted mb-1">{{ form.author.label }}</label>
        {{ form.author }}
    </div>
    <div class="col-12 col-md-2">
        <button type="submit" class="btn btn-primary w-100">Найти</button>
    </div>
    {% if form.is_active %}
    <div class="col-12">
        <a href="{% url 'books' %}" class="small reset-filters">Сбросить фильтры</a>
    </div>
    {% endif %}
</form>
