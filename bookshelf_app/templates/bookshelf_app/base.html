<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        />

        <title>{% block title %}Дневник читателя{% endblock %}</title>
        <style>
            html,
            body {
                height: 100%;
            }

            /* Фон страницы чуть темнее белого, чтобы белые карточки выделялись. */
            body {
                display: flex;
                flex-direction: column;
                background-color: #eef0f3;
            }

            main {
                flex: 1 0 auto;
            }

            footer {
                flex-shrink: 0;
            }

            /* Поднимает элемент над .stretched-link: у её ::after z-index: 1, position-relative мало. */
            .above-stretched-link {
                position: relative;
                z-index: 2;
            }

            /* Карточки книг в каталоге, в подборке «Что почитать» и мини-карточки дневника. */
            .book-card {
                transition: transform .15s ease-in-out, box-shadow .15s ease-in-out;
            }

            .book-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
            }

            .book-card .rating {
                color: #ffc107;
                letter-spacing: .1rem;
            }

            .book-card .card-title a {
                color: inherit;
                text-decoration: none;
            }

            .book-card:hover .card-title a {
                text-decoration: underline;
            }
        </style>

        {# Для стилей #}
        {% block extra_css %}{% endblock %}
    </head>

    <body>
        <header>{% include 'bookshelf_app/include/menu.html' %}</header>

        <main>
            {% if messages %}
            <div class="container pt-3">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            {% block content %}{% endblock %}
        </main>

        <footer class="bg-body-tertiary text-center text-muted py-3 border-top">
            <div class="container">
                <p class="mb-1">Разработчик: <strong>Матукин Иван</strong></p>
                <p class="mb-0">Проектная работа OUTS</p>
            </div>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
