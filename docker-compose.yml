# Полный стек приложения: брокер, веб-сервер и celery-воркер.
# Запуск: docker compose up --build
name: bookshelf

services:
  # Redis — брокер очереди: через него web передаёт задачи воркеру.
  redis:
    image: redis:7-alpine
    container_name: bookshelf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PostgreSQL — основная база проекта: книги, читатели, отзывы.
  db:
    image: postgres:latest
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6

  # Django — сам сайт на http://localhost:8000/ и накат миграций при старте.
  web:
    build:
      context: .
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    image: bookshelf-app
    container_name: bookshelf-web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py runserver 0.0.0.0:8000"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      POSTGRES_HOST: db
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Celery-воркер — выполняет фоновые задачи из очереди (лог о новой книге).
  worker:
    build:
      context: .
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    image: bookshelf-app
    container_name: bookshelf-worker
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      POSTGRES_HOST: db
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  redis_data:
  db_data:
