image: python:3.14

default:
  tags:
    - my-docker-runner

stages:
  - testing
  - build
  - deploy

before_script:
  - python --version
  - python -m pip install --upgrade pip
  - pip install poetry
  - poetry install

lint:
  stage: testing
  script:
    - make lint

test:
  stage: testing
  services:
    - postgres
  variables:
    POSTGRES_USER: gitlabuser
    POSTGRES_PASSWORD: gitlabpass
    POSTGRES_DB: gitlabdb
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    COVERAGE_DIR: coverage-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA
  script:
    - poetry run pytest -s --cov --cov-report html:$COVERAGE_DIR --cov-fail-under=95
  artifacts:
    name: $COVERAGE_DIR
    paths:
      - $COVERAGE_DIR
    when: on_success
    expire_in: 1 week

build-job:
  stage: build
  script:
    - echo "TODO building."

deploy-job:
  stage: deploy
  script:
    - echo "TODO deploying."
